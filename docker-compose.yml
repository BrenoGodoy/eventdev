services:
  postgres:
    image: postgres:16-alpine
    container_name: eventdev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventdev
      POSTGRES_USER: eventdev
      POSTGRES_PASSWORD: eventdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventdev -d eventdev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: eventdev-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eventdev:eventdev@postgres:5432/eventdev?schema=public
      NODE_ENV: development
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: >
      sh -c "npm run prisma:generate --workspace=api &&
             npm run prisma:migrate --workspace=api &&
             npm run start:dev --workspace=api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: eventdev-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command: npm run dev --workspace=web -- --hostname 0.0.0.0 --port 3000

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
